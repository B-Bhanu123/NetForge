[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netforge"
version = "1.0.0"
description = "NetForge Enterprise Network Simulation & Proxy Framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "urllib3>=2.2.1",
    "requests>=2.31.0",
    "prometheus-client>=0.20.0"
]

[project.scripts]
netforge = "main:main"
